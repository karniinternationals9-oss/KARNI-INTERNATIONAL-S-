<!DOCTYPE html>
<html lang="en-IN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact Us – Order Chai Patti on WhatsApp | Karni International's</title>
  <meta name="description" content="Contact Karni International's for orders, bulk and wholesale enquiries. Call, WhatsApp or email us – we are happy to help.">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#4A2C1D">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Karni International's">
  <meta property="og:title" content="Contact Us – Order Chai Patti on WhatsApp | Karni International's">
  <meta property="og:description" content="Contact Karni International's for orders, bulk and wholesale enquiries. Call, WhatsApp or email us – we are happy to help.">
  <meta property="og:image" content="/assets/og-image.png">
  <meta property="og:locale" content="en_IN">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml">
  <link rel="icon" href="/assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Poppins:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="/css/style.css">
  <script>document.documentElement.classList.add("js");</script>
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>
  <div id="site-header"></div>

  <main id="main">

  <section class="page-hero">
    <div class="container">
      <nav class="breadcrumb" aria-label="Breadcrumb"><a href="/">Home</a> / <span>Contact</span></nav>
      <h1>Contact Us</h1>
      <p>Questions, bulk orders or feedback – we would love to hear from you.</p>
    </div>
  </section>
    <section class="section">
      <div class="container">
        <div class="contact-grid">
          <div class="card reveal">
            <h2>Get in touch</h2>
            <ul class="contact-list">
              <li><span class="ic" id="ci-phone"></span><div><span>Phone</span><a data-config="phone" data-config-href="phone" href="#">—</a></div></li>
              <li><span class="ic" id="ci-wa"></span><div><span>WhatsApp</span><a data-config-href="whatsapp" data-wa-text="Hi, I have a question about your chai patti." href="#" target="_blank" rel="noopener">Chat with us</a></div></li>
              <li><span class="ic" id="ci-mail"></span><div><span>Email</span><a data-config="email" data-config-href="email" href="#">—</a></div></li>
              <li><span class="ic" id="ci-pin"></span><div><span>Address</span><strong data-config="address">—</strong></div></li>
              <li><span class="ic" id="ci-clock"></span><div><span>Business hours</span><strong data-config="businessHours">—</strong></div></li>
            </ul>
          </div>
          <form class="card reveal" id="contact-form" novalidate>
            <h2>Send us a message</h2>
            <p class="muted">Your message will open in WhatsApp, ready to send.</p>
            <div class="field">
              <label for="m-name">Your name <span class="req" aria-hidden="true">*</span></label>
              <input id="m-name" name="name" type="text" autocomplete="name" maxlength="80" required>
              <span class="field-error" id="m-name-err"></span>
            </div>
            <div class="field">
              <label for="m-phone">Mobile number <span class="muted">(optional)</span></label>
              <input id="m-phone" name="phone" type="tel" inputmode="numeric" autocomplete="tel-national" maxlength="16">
              <span class="field-error" id="m-phone-err"></span>
            </div>
            <div class="field">
              <label for="m-subject">Subject</label>
              <select id="m-subject" name="subject">
                <option>Product enquiry</option>
                <option>Order status</option>
                <option>Bulk / wholesale order</option>
                <option>Feedback</option>
                <option>Other</option>
              </select>
            </div>
            <div class="field">
              <label for="m-message">Message <span class="req" aria-hidden="true">*</span></label>
              <textarea id="m-message" name="message" maxlength="1000" required></textarea>
              <span class="field-error" id="m-message-err"></span>
            </div>
            <button class="btn btn--whatsapp btn--block" type="submit"><svg viewBox="0 0 24 24" fill="currentColor" width="20" height="20" aria-hidden="true"><path d="M17.5 14.4c-.3-.1-1.8-.9-2-1-.3-.1-.5-.1-.7.1-.2.3-.8 1-.9 1.2-.2.2-.3.2-.6.1-.3-.1-1.3-.5-2.4-1.5-.9-.8-1.5-1.8-1.7-2.1-.2-.3 0-.5.1-.6l.4-.5c.2-.2.2-.3.3-.5.1-.2 0-.4 0-.5l-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.1.2 2.1 3.2 5.1 4.5.7.3 1.3.5 1.7.6.7.2 1.4.2 1.9.1.6-.1 1.8-.7 2-1.4.2-.7.2-1.3.2-1.4-.1-.2-.3-.2-.6-.4zM12 21.8a9.8 9.8 0 0 1-5-1.4l-.4-.2-3.7 1 1-3.6-.2-.4A9.8 9.8 0 1 1 12 21.8zm8.4-18.2A11.8 11.8 0 0 0 1.8 17.8L.1 24l6.3-1.7A11.8 11.8 0 0 0 24 12a11.7 11.7 0 0 0-3.6-8.4z"/></svg> Send on WhatsApp</button>
          </form>
        </div>
        <div class="map-wrap reveal" id="map-wrap"></div>
      </div>
    </section>
  </main>

  <div id="site-footer"></div>
  <noscript><p style="text-align:center;padding:16px">Please enable JavaScript to shop on this website.</p></noscript>
  <script src="/js/common.js" defer></script>
  <script src="/js/contact.js" defer></script>
</body>
</html>
